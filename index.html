<!doctype html>
<html lang="fr">
<head>
<title>Atelier Bouclé</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Onerom">
<meta name="theme-color" content="#F1F2F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..500&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout : boutique en ligne en trois cartes blanches flottantes (dressing | cabine avec ma photo sur un podium | mon look). Bleu marine et rouge sur blanc, une seule ambiance claire assumée. */
:root{
  --bg:#F1F2F6;     /* fond gris bleuté */
  --card:#FFFFFF;   /* cartes */
  --tile:#F4F5F9;   /* fond des vignettes produit */
  --navy:#13224D;   /* bleu marine : texte fort, actions */
  --ink:#0D1530;
  --red:#C8102E;    /* rouge : accents */
  --sky:#E9EEF8;    /* bleu très pâle */
  --line:#E2E5ED;
  --muted:#666E88;
  --good:#1F6B4A;
  --shadow:0 1px 2px rgba(19,34,77,.05),0 10px 30px rgba(19,34,77,.07);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Jost","Futura","Century Gothic","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;color:var(--ink);background:var(--bg);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:1400px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;color:var(--navy)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:0 0 auto}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.lbl{font-family:var(--f-body);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lbl svg{width:14px;height:14px;vertical-align:-2px;fill:none;stroke:var(--red);stroke-width:1.6;margin-right:3px}
.lbl.red{color:var(--navy)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.care{font-size:13px;color:var(--muted);margin:8px 0 0}

/* Maison */
.brand{display:inline-flex;flex-direction:column;gap:6px;min-width:0}
.wm{font-family:var(--f-display);font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--navy);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.stripe{display:flex;gap:3px}
.stripe i{display:block;width:22px;height:2px;background:var(--navy)}
.stripe i+i{background:var(--red)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 12px}
@media(min-width:1060px){header.top.studio-h{display:none}}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sky) center/cover;border:1px solid var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--navy);flex:0 0 auto;padding:0}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.ai-pill{font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--card);color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.ai-pill.on{color:var(--navy);border-color:var(--navy)}
.ai-pill.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}

/* Cartes */
.panel{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.ph-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.page-title{font-size:clamp(28px,5vw,40px)}

/* Studio */
.studio{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.studio .left{display:none}
.studio .right{display:grid;gap:14px;align-content:start;min-width:0}
@media(min-width:1060px){
  .studio{grid-template-columns:300px minmax(0,1fr) 330px;align-items:start;padding-top:18px}
  .studio .left{display:block;position:sticky;top:16px;max-height:calc(100vh - 120px);overflow:auto;scrollbar-width:thin}
  .studio .right{position:sticky;top:16px;max-height:calc(100vh - 120px);overflow:auto;scrollbar-width:thin;padding-bottom:4px}
}

/* Recherche, onglets, puces */
.searchbox{position:relative;display:block}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.7;pointer-events:none}
.searchbox input{width:100%;border:1px solid transparent;background:var(--tile);border-radius:12px;padding:11px 14px 11px 38px;font-size:14px}
.searchbox input:focus{border-color:var(--navy);outline:none;background:var(--card)}
.tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:9px 0 8px;font-size:13.5px;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tab sup{font-size:9.5px;margin-left:1px}
.tab[aria-pressed="true"]{color:var(--navy);border-bottom-color:var(--red);font-weight:500}
.tab.warn{color:var(--red)}
.moodtabs{margin-top:0;gap:26px;border-bottom-color:transparent}
.moodtabs .tab{font-size:14px;letter-spacing:.04em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--card);border-color:var(--navy)}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 0 10px}
.sh h3{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--ink)}
.link{background:none;border:0;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.brandtile{aspect-ratio:1.5;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.brandtile[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 -2px 0 var(--red)}

/* Fiches produit */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.page-dress .pgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media(min-width:700px){.page-dress .pgrid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr))}}
.pc{position:relative;min-width:0}
.pimg{display:grid;place-items:center;width:100%;aspect-ratio:4/5;max-width:100%;border-radius:12px;background:var(--tile);border:0;padding:14px;overflow:hidden;position:relative}
.pimg img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:transform .3s}
.pimg:hover img{transform:scale(1.04)}
.heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(19,34,77,.14)}
.heart svg{width:15px;height:15px;fill:none;stroke:var(--navy);stroke-width:1.7}
.heart[aria-pressed="true"] svg{fill:var(--red);stroke:var(--red)}
.badge{position:absolute;top:8px;left:8px;background:var(--navy);color:var(--card);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:4px;font-weight:500}
.badge.red{background:var(--red)}
.meta{display:grid;padding:9px 2px 0;min-width:0}
.meta .b,.lrow .b,.reco .b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .n,.reco .n{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .p,.reco .p{font-size:13px;font-weight:500;color:var(--navy);font-variant-numeric:tabular-nums}
.price{font-family:var(--f-body);font-size:16px;color:var(--navy);font-weight:500}

/* Cabine */
.stage{position:relative;border-radius:22px;overflow:hidden;height:min(78vh,760px);min-height:480px;margin-top:12px;
  background:radial-gradient(ellipse 55% 45% at 50% 40%,var(--card),rgba(255,255,255,0) 75%),linear-gradient(180deg,#F9FAFC 0%,#E9ECF3 100%);box-shadow:var(--shadow)}
.podium{position:absolute;left:50%;bottom:5.5%;width:min(58%,330px);aspect-ratio:4/1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 28%,var(--card) 45%,#DFE3EC 100%);box-shadow:0 18px 30px rgba(19,34,77,.13),inset 0 -5px 10px rgba(19,34,77,.06)}
.p360{position:absolute;left:50%;bottom:1.3%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:6px;background:none;border:0;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:4px 8px}
.p360 svg{width:22px;height:10px;fill:none;stroke:currentColor;stroke-width:1.3}
.p360[aria-pressed="true"]{color:var(--red)}
.figure{position:absolute;left:50%;bottom:9.5%;height:82%;aspect-ratio:3/5;max-width:60%;transform:translateX(-50%)}
.bodyimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom center;pointer-events:none}
.figure.mirror .bodyimg{transform:scaleX(-1)}
.ghost-fig{position:absolute;inset:0;width:100%;height:100%}
.ghost-fig path,.ghost-fig circle{fill:rgba(255,255,255,.75);stroke:var(--navy);stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:4 4}
.wear{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 4px 6px rgba(13,21,48,.16));max-width:none}
.wear.sel{outline:1px dashed var(--red);outline-offset:3px;cursor:grabbing}
.flat{position:absolute;inset:70px 84px 64px 70px;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px;align-content:center;justify-items:center}
.flat button{border:0;background:none;padding:0;display:grid;place-items:center;width:100%;height:170px}
.flat img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(13,21,48,.14))}
.hud{position:absolute;z-index:3}
.hud.tl{left:18px;top:16px;display:grid}
.hud.tl b{font-family:var(--f-display);font-weight:500;font-size:24px;color:var(--navy);font-style:italic;line-height:1.2}
.hud.bl{left:18px;bottom:16px}
.meter{display:flex;align-items:center;gap:8px}
.meter i{display:block;width:64px;height:3px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.meter i::after{content:"";position:absolute;inset:0;width:var(--v);background:linear-gradient(90deg,var(--navy),var(--red))}
.rail{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:4}
.rail button{width:40px;height:40px;border-radius:50%;background:var(--card);border:0;box-shadow:0 1px 4px rgba(19,34,77,.14);display:grid;place-items:center;padding:0;color:var(--navy)}
.rail button:hover{background:var(--navy);color:var(--card)}
.rail svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.seg{position:absolute;right:14px;top:14px;z-index:4;display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:0 1px 4px rgba(19,34,77,.14)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--card)}
.thumbs{position:absolute;right:14px;top:62px;bottom:52px;display:flex;flex-direction:column;gap:8px;overflow:auto;z-index:4;scrollbar-width:none;padding:2px}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{width:52px;height:52px;flex:0 0 auto;border-radius:12px;background:var(--card) center/contain no-repeat;background-origin:content-box;padding:6px;border:1px solid var(--line)}
.thumbs button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 -2px 0 var(--red)}
.ctl{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;align-items:center;background:var(--card);border-radius:999px;padding:5px 6px 5px 14px;white-space:nowrap;box-shadow:0 2px 10px rgba(19,34,77,.14)}
.ctl button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);padding:0;font-size:16px;line-height:1;color:var(--navy)}
.stage-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:2;width:70%;display:grid;gap:8px;justify-items:center}
.stage-empty.low{top:auto;bottom:16%;transform:translateX(-50%)}
.hint{margin:10px 4px 0}
@media(max-width:600px){.stage{min-height:450px;height:70vh}.figure{max-width:58%}.thumbs button{width:44px;height:44px;border-radius:10px}.rail button{width:36px;height:36px}.flat{inset:64px 64px 60px 58px;gap:10px}.flat button{height:120px}.hud.tl b{font-size:20px}}
@media(prefers-reduced-motion:reduce){.pimg img{transition:none}.sheet{animation:none!important}}

/* Mon look */
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.th{width:56px;height:56px;border-radius:10px;background:var(--tile);display:grid;place-items:center;padding:5px;flex:0 0 auto}
.th img{max-width:100%;max-height:100%;object-fit:contain}
.lrow .t{display:grid;min-width:0}
.lrow .t b{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.lrow .t small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px}
.ib{width:32px;height:32px;border-radius:50%;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--navy)}
.ib:hover{background:var(--tile)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 0;font-size:13px;color:var(--muted)}
.total b{color:var(--navy);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:12px 18px;border:1px solid var(--navy);background:var(--navy);color:var(--card);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.btn:hover{background:var(--ink)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:var(--tile)}
.btn.pink,.btn.danger{background:var(--red);border-color:var(--red);color:var(--card)}
.btn.small{padding:8px 12px;font-size:10.5px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.block{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.block p{margin:6px 0 0;font-size:14px}
.checks{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.checks svg{width:17px;height:17px;fill:none;stroke:var(--navy);stroke-width:1.5;margin-top:1px}
.hair{background:var(--sky);border-radius:14px;padding:14px;margin-top:16px}
.hair .lbl{color:var(--navy)}
.hair h3{font-size:19px;margin-top:4px}
.hair p{margin:6px 0 0;font-size:14px}
.mk{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.mk li{display:flex;gap:10px;align-items:center;min-width:0;font-size:14px}
.mk .th{width:40px;height:40px;padding:4px}
.mk .gen{border:1px dashed var(--line);background:none;color:var(--muted)}
.mk small{display:block;color:var(--muted);font-size:12px}
.reco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;margin-top:12px}
.reco button{border:0;background:none;padding:0;text-align:left;display:grid;min-width:0}
.reco .im{aspect-ratio:3/4;max-width:100%;border-radius:10px;background:var(--tile);display:grid;place-items:center;padding:8px;margin-bottom:6px}
.reco .im img{max-width:100%;max-height:100%;object-fit:contain}

/* Divers */
.banner{margin-top:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.empty{text-align:center;padding:32px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty h3{color:var(--navy);font-size:20px;margin-bottom:6px}
.empty p{margin:0}
.job{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:10px 14px;flex-wrap:wrap}
.job .bar,.meter.big i{display:block;flex:1;min-width:120px;height:4px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.job .bar::after,.meter.big i::after{content:"";position:absolute;inset:0;width:var(--v);background:linear-gradient(90deg,var(--navy),var(--red));transition:width .3s}
.meter.big{margin-top:12px}.meter.big i{width:100%}
.busy{display:flex;gap:12px;align-items:center;padding:30px 4px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--red);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.checker{background:repeating-conic-gradient(var(--card) 0 25%,var(--tile) 0 50%) 0 0/20px 20px}
.ai-guess{margin:10px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.tagai{background:var(--navy);color:var(--card);font-size:10px;letter-spacing:.14em;padding:2px 8px;border-radius:4px;font-weight:500}
.panel p.ok{color:var(--good);margin:8px 0 0;font-weight:500}
.panel p.err{color:var(--red);margin:10px 0 0;font-size:13px}
.panel>p{margin:8px 0 0}

/* Navigation */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:space-around;align-items:center}
@media(min-width:900px){nav.bar{left:50%;right:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);border:1px solid var(--line);border-radius:999px;padding:6px 18px;gap:10px;box-shadow:0 10px 30px rgba(19,34,77,.14)}}
nav.bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 8px;min-width:58px;position:relative}
nav.bar button[aria-current="page"]{color:var(--navy);font-weight:500}
nav.bar button[aria-current="page"]::after{content:"";position:absolute;bottom:-3px;width:4px;height:4px;border-radius:50%;background:var(--red)}
nav.bar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4}
nav.bar .plus{width:50px;height:50px;border-radius:50%;background:var(--navy);display:grid;place-items:center;margin-top:-24px;box-shadow:0 6px 18px rgba(19,34,77,.28);border:3px solid var(--card)}
@media(min-width:900px){nav.bar .plus{margin-top:0;width:42px;height:42px}}
nav.bar .plus svg{stroke:var(--card);stroke-width:1.8}

/* Feuilles */
.sheet-bg{position:fixed;inset:0;background:rgba(13,21,48,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .25s ease}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:26px}
.field{display:grid;gap:6px;margin-top:16px;min-width:0}
.field.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.field.two .field{margin-top:0}
.field label,.field .lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field input[type=text],.field select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;width:100%}
.field input[type=text]:focus,.field select:focus{border-color:var(--navy);outline:none}
.preview{border-radius:16px;overflow:hidden;background:var(--tile);max-height:44vh;display:grid;place-items:center}
.preview img{max-height:44vh;width:auto;max-width:100%;display:block}
.cam{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cam label{border:1px solid var(--navy);border-radius:14px;padding:22px 10px;text-align:center;cursor:pointer;display:grid;gap:6px;justify-items:center;background:var(--card);font-size:13px;letter-spacing:.06em;color:var(--navy)}
.cam label.main{background:var(--navy);color:var(--card)}
.cam svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.4}
.colorrow{display:flex;gap:12px;align-items:center}
.colorrow input[type=color]{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;padding:0;background:none;overflow:hidden}
.toggle{display:flex;gap:10px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--card);padding:10px 18px;border-radius:10px;font-size:13px;z-index:60;white-space:nowrap}

/* Profil, favoris */
.prof{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.prof{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.prof-photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--tile) center/contain no-repeat;border:1px dashed rgba(19,34,77,.3);display:grid;place-items:center;text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative;overflow:hidden}
.ph.has{border-style:solid;border-color:var(--line)}
.ph.has span{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--card);padding:3px 10px;border-radius:999px;color:var(--navy)}
.favs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.fav .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fav .mini div{aspect-ratio:1;max-width:100%;background:var(--tile);border-radius:10px;display:grid;place-items:center;padding:6px}
.fav .mini img{max-width:100%;max-height:100%;object-fit:contain}
.fav h3{font-size:20px;margin-top:12px}
.fav p{margin:2px 0 10px;color:var(--muted);font-size:13px}
/* Ajustements */
.lhead .wm{font-size:15px;letter-spacing:.16em}
.brands{grid-template-columns:repeat(3,minmax(0,1fr))}
.brandtile{white-space:normal;line-height:1.15;font-size:11px;word-break:break-word;aspect-ratio:auto;min-height:48px;padding:6px}
.th,.reco .im,.fav .mini div,.pimg{overflow:hidden}
.th img,.reco .im img,.fav .mini img,.pimg img{width:100%;height:100%;object-fit:contain}
@media(max-width:600px){.hud.bl{bottom:auto;top:66px}.p360{bottom:1%}}
.th,.reco .im,.fav .mini div,.pimg{position:relative}
.th img,.reco .im img,.fav .mini img,.pimg img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}

<script type="text/plain" id="ai-src">
import {env,AutoModel,AutoProcessor,AutoTokenizer,CLIPTextModelWithProjection,CLIPVisionModelWithProjection,RawImage,Tensor} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1";
env.allowLocalModels=false;
const CLIP="Xenova/clip-vit-base-patch32";
let rmbg,clipProc,clipVision,clipTok,clipText;
const P=d=>self.postMessage({type:"progress",file:d.file,name:d.name,status:d.status,loaded:d.loaded,total:d.total});
const O={device:"wasm",dtype:"q8",progress_callback:P};
async function init(){
  if(!rmbg)rmbg=await AutoModel.from_pretrained("briaai/RMBG-1.4",{...O,config:{model_type:"custom"}});
  if(!clipProc)clipProc=await AutoProcessor.from_pretrained(CLIP,{progress_callback:P});
  if(!clipVision)clipVision=await CLIPVisionModelWithProjection.from_pretrained(CLIP,O);
  if(!clipTok)clipTok=await AutoTokenizer.from_pretrained(CLIP,{progress_callback:P});
  if(!clipText)clipText=await CLIPTextModelWithProjection.from_pretrained(CLIP,O);
  return true}
function norm(a){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*a[i];s=Math.sqrt(s)||1;const o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]/s;return o}
/* Détourage : RMBG-1.4 en 1024×1024, masque remis à la taille de la photo, recadrage sur le sujet. */
async function cut(blob){
  const bm=await createImageBitmap(blob);const W=bm.width,H=bm.height,S=1024,N=S*S;
  const c=new OffscreenCanvas(S,S),x=c.getContext("2d");x.drawImage(bm,0,0,S,S);const px=x.getImageData(0,0,S,S).data;
  const f=new Float32Array(3*N);for(let i=0;i<N;i++){f[i]=px[i*4]/255-.5;f[N+i]=px[i*4+1]/255-.5;f[2*N+i]=px[i*4+2]/255-.5}
  const out=await rmbg({input:new Tensor("float32",f,[1,3,S,S])});const m=(out.output||Object.values(out)[0]).data;
  let mn=Infinity,mxv=-Infinity;for(let i=0;i<N;i++){if(m[i]<mn)mn=m[i];if(m[i]>mxv)mxv=m[i]}const rg=(mxv-mn)||1;
  const mc=new OffscreenCanvas(S,S),mcx=mc.getContext("2d"),md=mcx.createImageData(S,S);
  for(let i=0;i<N;i++)md.data[i*4+3]=Math.round((m[i]-mn)/rg*255);mcx.putImageData(md,0,0);
  const oc=new OffscreenCanvas(W,H),ox=oc.getContext("2d");ox.drawImage(mc,0,0,W,H);const ma=ox.getImageData(0,0,W,H).data;
  ox.clearRect(0,0,W,H);ox.drawImage(bm,0,0);const id=ox.getImageData(0,0,W,H),d=id.data;
  let x0=W,y0=H,x1=-1,y1=-1,kept=0;
  for(let y=0;y<H;y++)for(let X=0;X<W;X++){const k=(y*W+X)*4,a=ma[k+3];d[k+3]=a<12?0:a;if(a>40){kept++;if(X<x0)x0=X;if(X>x1)x1=X;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0||kept<W*H*.01)return{cut:null};
  ox.putImageData(id,0,0);const cc=new OffscreenCanvas(x1-x0+1,y1-y0+1);cc.getContext("2d").drawImage(oc,-x0,-y0);
  return{cut:await cc.convertToBlob({type:"image/png"})}}
async function embedImage(blob){const im=await RawImage.fromBlob(blob);const inp=await clipProc(im);const{image_embeds}=await clipVision(inp);return norm(image_embeds.data)}
async function embedText(texts){const ti=clipTok(texts,{padding:true,truncation:true});const{text_embeds}=await clipText(ti);const D=text_embeds.dims[1];
  return texts.map((_,i)=>norm(text_embeds.data.slice(i*D,(i+1)*D)))}
self.onmessage=async e=>{const{id,cmd,data}=e.data;try{let r;
  if(cmd==="init")r=await init();else if(cmd==="cut")r=await cut(data);else if(cmd==="embedImage")r=await embedImage(data);else if(cmd==="embedText")r=await embedText(data);
  self.postMessage({id,ok:true,r})}catch(err){self.postMessage({id,ok:false,err:String(err&&err.message||err)})}};
</script>

/* ================= Couleurs ================= */
function hexToRgb(h){h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function rgbToHex(r,g,b){return"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("")}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function colorInfo(hex){const[h,s,l]=rgbToHsl(...hexToRgb(hex));let name,neutral=true;
  if(l<.14)name="noir";else if(l>.9&&s<.4)name="blanc";else if(s<.12)name=l>.68?"gris clair":l>.38?"gris":"anthracite";
  else if(h>=15&&h<50&&s<.55)name=l>.74?"crème":l>.52?"beige":l>.3?"camel":"marron";
  else if(h>=190&&h<240&&s<.45&&l<.62)name="denim";
  else{neutral=false;
    if(h<12||h>=345)name=l>.7?"rose poudré":l<.3?"bordeaux":"rouge";else if(h<40)name=l>.7?"pêche":"orange";else if(h<65)name="jaune";
    else if(h<165)name=l<.3?"vert sapin":"vert";else if(h<250)name=l<.3?"bleu marine":"bleu";else if(h<290)name="violet";else name=l>.7?"rose pâle":"rose";
    if(name==="bleu marine")neutral=true}
  return{hex,h,s,l,name,neutral}}
function metal(c){if(!c)return null;if(c.l>.86&&c.s<.35)return"perle";if(c.h>=28&&c.h<64&&c.s>.2&&c.l>.28&&c.l<.82)return"doré";if(c.s<.15&&c.l>.5)return"argenté";if((c.h<28||c.h>340)&&c.s>.2&&c.l>.5&&c.l<.8)return"or rose";return null}
const colorName=it=>it.section==="bijoux"?(metal(it.color)||it.color?.name||""):(it.color?.name||"");
/* Couleur dominante : sur les pixels du sujet si le fond est retiré, sinon au centre de la photo */
async function dominantFrom(blob,alpha){const bm=await bitmap(blob);const sc=Math.min(1,160/Math.max(bm.width,bm.height));const w=Math.max(1,Math.round(bm.width*sc)),h=Math.max(1,Math.round(bm.height*sc));
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(bm,0,0,w,h);const d=x.getImageData(0,0,w,h).data;const B=new Map();
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){if(!alpha&&(X<w*.25||X>w*.75||y<h*.25||y>h*.75))continue;const k4=(y*w+X)*4;if(alpha&&d[k4+3]<200)continue;
    const k=(d[k4]>>5)<<6|(d[k4+1]>>5)<<3|(d[k4+2]>>5);const e=B.get(k)||{n:0,r:0,g:0,b:0};e.n++;e.r+=d[k4];e.g+=d[k4+1];e.b+=d[k4+2];B.set(k,e)}
  let best=null;for(const e of B.values())if(!best||e.n>best.n)best=e;return best?rgbToHex(best.r/best.n,best.g/best.n,best.b/best.n):"#cccccc"}
const hueDist=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
function loud(colors){const fams=[];colors.filter(c=>c&&!c.neutral).forEach(c=>{if(!fams.some(f=>hueDist(f.h,c.h)<28))fams.push(c)});return fams}
function harmony(colors){const f=loud(colors);if(!f.length)return 1.2;if(f.length===1)return 2;
  if(f.length===2){const d=hueDist(f[0].h,f[1].h);return d<55?1.4:d>150?.4:-1.5}return-4}

/* ================= Images ================= */
async function bitmap(src){try{return await createImageBitmap(src,{imageOrientation:"from-image"})}catch(_){
  const u=typeof src==="string"?src:URL.createObjectURL(src);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("img"));i.src=u});return im}}
const toBlob=(c,type="image/jpeg",q=.82)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("blob")),type,q));
async function shrink(src,max,type="image/jpeg",bg=null,q=.82){const bm=await bitmap(src);const sc=Math.min(1,max/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(bm.width*sc));c.height=Math.max(1,Math.round(bm.height*sc));const x=c.getContext("2d");
  if(bg){x.fillStyle=bg;x.fillRect(0,0,c.width,c.height)}x.drawImage(bm,0,0,c.width,c.height);return toBlob(c,type,q)}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function dataURLToBlob(u){const[h,d]=u.split(",");const mime=(h.match(/:(.*?);/)||[])[1]||"image/jpeg";const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
function cropAlphaCanvas(c){const x=c.getContext("2d"),w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++)if(d[(y*w+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return c;const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(c,-x0,-y0);return o}
/* Détourage de secours sans IA : retire un fond uni à partir des bords */
async function floodCut(blob,max=520){const bm=await bitmap(blob);const sc=Math.min(1,max/Math.max(bm.width,bm.height));const w=Math.round(bm.width*sc),h=Math.round(bm.height*sc);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(bm,0,0,w,h);const id=x.getImageData(0,0,w,h),d=id.data;
  const R=[],G=[],Bb=[];const smp=k=>{R.push(d[k]);G.push(d[k+1]);Bb.push(d[k+2])};
  for(let i=0;i<w;i+=2){smp(i*4);smp(((h-1)*w+i)*4)}for(let j=0;j<h;j+=2){smp(j*w*4);smp((j*w+w-1)*4)}
  const med=a=>a.sort((p,q)=>p-q)[a.length>>1];const br=med(R),bg=med(G),bb=med(Bb);const tol=44;
  const seen=new Uint8Array(w*h),st=[];const push=p=>{if(!seen[p]){seen[p]=1;st.push(p)}};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(st.length){const p=st.pop(),k=p*4;const dd=Math.hypot(d[k]-br,d[k+1]-bg,d[k+2]-bb);if(dd>tol)continue;
    d[k+3]=dd<tol*.55?0:Math.round(255*(dd-tol*.55)/(tol*.45));const px=p%w,py=(p/w)|0;
    if(px>0)push(p-1);if(px<w-1)push(p+1);if(py>0)push(p-w);if(py<h-1)push(p+w)}
  x.putImageData(id,0,0);return toBlob(cropAlphaCanvas(c),"image/png")}

/* ================= IA locale (dans un Web Worker) ================= */
const AI={w:null,state:"off",msg:"",pend:new Map(),seq:0,files:{},labels:null,initP:null,
  get ready(){return this.state==="ready"},
  start(){if(this.initP)return this.initP;
    if(IN_CLAUDE){this.state="error";this.msg="L'IA locale fonctionne dans l'appli installée sur ton téléphone ou ton PC, pas dans cet aperçu.";render();return Promise.reject(new Error(this.msg))}
    try{const src=$("#ai-src").textContent;this.w=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})),{type:"module"})}
    catch(e){this.state="error";this.msg="Ce navigateur ne peut pas lancer l'IA.";render();return Promise.reject(e)}
    this.w.onmessage=e=>{const m=e.data;if(m.type==="progress"){if(m.file&&m.total){this.files[m.name+"/"+m.file]={l:m.loaded||0,t:m.total}}else if(m.status==="done"&&m.file&&this.files[m.name+"/"+m.file]){const f=this.files[m.name+"/"+m.file];f.l=f.t}aiProgress();return}
      const p=this.pend.get(m.id);if(!p)return;this.pend.delete(m.id);m.ok?p.res(m.r):p.rej(new Error(m.err))};
    this.w.onerror=e=>{this.state="error";this.msg="L'IA s'est arrêtée ("+(e.message||"erreur")+").";this.pend.forEach(p=>p.rej(new Error(this.msg)));this.pend.clear();render()};
    this.state="loading";render();
    this.initP=this.call("init").then(async()=>{await this.prepLabels();this.state="ready";kvSet("aiEnabled",true);render();toast("IA locale prête")})
      .catch(err=>{this.state="error";this.msg="Téléchargement impossible : vérifie ta connexion, puis réessaie. ("+String(err.message||err).slice(0,120)+")";this.initP=null;try{this.w.terminate()}catch(_){}this.w=null;render();throw err});
    return this.initP},
  call(cmd,data){return new Promise((res,rej)=>{const id=++this.seq;this.pend.set(id,{res,rej});this.w.postMessage({id,cmd,data})})},
  async prepLabels(){const saved=await kvGet("labels:v1");if(saved&&saved.types&&saved.types.length===Object.keys(TYPE_EN).length){this.labels=saved;return}
    const types=Object.keys(TYPE_EN),moods=Object.keys(MOOD_EN);
    const embs=await this.call("embedText",[...types.map(t=>"a product photo of "+TYPE_EN[t]),...moods.map(m=>"a photo of "+MOOD_EN[m])]);
    this.labels={types:types.map((t,i)=>({type:t,emb:embs[i]})),moods:Object.fromEntries(moods.map((m,i)=>[m,embs[types.length+i]]))};await kvSet("labels:v1",this.labels)},
  classify(emb){const sims=this.labels.types.map(l=>({type:l.type,s:dot(emb,l.emb)*100}));const mx=Math.max(...sims.map(x=>x.s));const ex=sims.map(x=>({...x,e:Math.exp(x.s-mx)}));const Z=ex.reduce((a,x)=>a+x.e,0);
    const top=ex.map(x=>({type:x.type,p:x.e/Z})).sort((a,b)=>b.p-a.p).slice(0,3);
    const ms=Object.entries(this.labels.moods).map(([k,e])=>[k,dot(emb,e)*100]);const mm=Math.max(...ms.map(x=>x[1]));const me=ms.map(([k,s])=>[k,Math.exp(s-mm)]);const MZ=me.reduce((a,x)=>a+x[1],0);
    const moods=me.map(([k,e])=>[k,e/MZ]).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>.24).slice(0,2).map(x=>x[0]);return{top,moods}}
};
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s}
function aiProgress(){const fs=Object.values(AI.files);const t=fs.reduce((a,f)=>a+f.t,0),l=fs.reduce((a,f)=>a+f.l,0);const el=$("#ai-bar");
  if(el){el.style.setProperty("--v",(t?l/t*100:3)+"%");const tx=$("#ai-mb");if(tx)tx.textContent=`${Math.round(l/1048576)} / ${Math.round(t/1048576)} Mo`}}
/* Affinité d'une pièce avec un mood selon l'IA (écart à sa moyenne sur tous les moods) */
function moodAffinity(it,mood){if(!AI.labels||!it.emb)return 0;if(!it._ms){it._ms={};const v=Object.entries(AI.labels.moods).map(([k,e])=>[k,dot(it.emb,e)]);const m=v.reduce((a,x)=>a+x[1],0)/v.length;
  const sd=Math.sqrt(v.reduce((a,x)=>a+(x[1]-m)**2,0)/v.length)||1;v.forEach(([k,s])=>it._ms[k]=(s-m)/sd)}return Math.max(-1.6,Math.min(1.6,it._ms[mood]||0))}

/* Analyse complète d'une photo : compression, détourage, miniature, couleur, empreinte IA */
async function analyzePhoto(file,{ai=AI.ready}={}){
  const img=await shrink(file,1200,"image/jpeg",null,.84);let cut=null;
  if(ai){try{const r=await AI.call("cut",img);cut=r.cut}catch(_){}}
  if(!cut){try{cut=await floodCut(img)}catch(_){}}
  const thumb=await shrink(cut||img,420,"image/jpeg","#ffffff",.8);
  const color=colorInfo(await dominantFrom(cut||img,!!cut));
  let emb=null,guess=null;if(ai){try{emb=await AI.call("embedImage",thumb);guess=AI.classify(emb)}catch(_){}}
  return{img,cut,thumb,color,emb,guess}}
async function storeFiles(id,a){await fPut(id+":img",a.img);if(a.cut)await fPut(id+":cut",a.cut);else await fDel(id+":cut");await fPut(id+":thumb",a.thumb);await loadURL(id+":thumb")}
async function deleteItemFiles(id){for(const k of["img","cut","thumb"])await fDel(id+":"+k)}

  if(r==="top"||r==="outer"){P([[cx-70,cy-130],[cx-28,cy-145],[cx,cy-122],[cx+28,cy-145],[cx+70,cy-130],[cx+160,cy+40],[cx+122,cy+60],[cx+80,cy-30],[cx+82,cy+130],[cx-82,cy+130],[cx-80,cy-30],[cx-122,cy+60],[cx-160,cy+40]]);

  else if(SECTIONS.chaussures.types.includes(type)){[-95,95].forEach(dx=>{x.beginPath();x.ellipse(cx+dx,cy,70,34,0,0,Math.PI*2);x.fill();x.stroke()});

function scoreItem(it,mood,prefs){let s=Math.random()*1.6;if(it.moods&&it.moods.length)s+=it.moods.includes(mood)?4:-3;else s+=moodAffinity(it,mood)*1.3;
  const i=(prefs||[]).indexOf(it.type);s+=i>=0?3-i*.4:-1;if(S.recent.has(it.id))s-=1.2;if(it.fav)s+=.8;return s}
function rank(list,mood,prefs,base){return list.map(it=>({it,s:scoreItem(it,mood,prefs)+(base?harmony([...base,it.color])*1.3:0)})).sort((a,b)=>b.s-a.s).map(x=>x.it)}
const bySec=(sec,types)=>S.items.filter(i=>i.section===sec&&!i.review&&(!types||types.includes(i.type)));
function pickJewels(mood,base){const M=MOODS[mood];const bj=bySec("bijoux");if(!bj.length||!M.jwN||(mood==="sport"&&Math.random()<.5))return{pool:bj,chosen:[]};
  const pref=S.profile.undertone==="chaud"?"doré":S.profile.undertone==="froid"?"argenté":null;
  const pool=bj.map(it=>({it,s:scoreItem(it,mood,M.jw)+(pref&&metal(it.color)===pref?1.6:0)+harmony([...base,it.color])*.5})).sort((a,b)=>b.s-a.s).map(x=>x.it);
  const chosen=[];let met=null;for(const it of pool){if(chosen.length>=M.jwN)break;if(chosen.some(c=>c.type===it.type))continue;
    const m=metal(it.color);if(met&&m&&m!==met&&m!=="perle"&&met!=="perle")continue;chosen.push(it);if(m&&m!=="perle")met=met||m}
  return{pool,chosen}}
function generate(mood){const M=MOODS[mood];const C=bySec("vetements");const R=r=>C.filter(i=>ROLE_OF[i.type]===r);
  const tops=R("top"),bottoms=R("bottom"),dresses=R("dress"),outers=R("outer");const ranked={},pieces=[];
  const rd=rank(dresses,mood,M.dress.length?M.dress:["Robe"]);const tagged=rd[0]&&rd[0].moods&&rd[0].moods.includes(mood);
  if(rd.length&&(!tops.length||!bottoms.length||Math.random()<(tagged?Math.max(M.dressP,.35):M.dressP))){ranked.dress=rd;pieces.push({role:"dress",id:rd[0].id})}
  else if(tops.length||bottoms.length){const rt=rank(tops,mood,M.top).slice(0,5),rb=rank(bottoms,mood,M.bottom).slice(0,5);let best=null;
    for(const t of rt.length?rt:[null])for(const b of rb.length?rb:[null]){const sc=(t?(rt.length-rt.indexOf(t))*.6:0)+(b?(rb.length-rb.indexOf(b))*.6:0)+harmony([t&&t.color,b&&b.color])*1.5+Math.random();if(!best||sc>best.sc)best={t,b,sc}}
    if(best.t){ranked.top=[best.t,...rank(tops,mood,M.top).filter(x=>x!==best.t)];pieces.push({role:"top",id:best.t.id})}
    if(best.b){ranked.bottom=[best.b,...rank(bottoms,mood,M.bottom).filter(x=>x!==best.b)];pieces.push({role:"bottom",id:best.b.id})}}
  const base=()=>pieces.map(p=>itemById(p.id).color);
  if(outers.length&&Math.random()<M.outerP){ranked.outer=rank(outers,mood,M.outer,base());pieces.push({role:"outer",id:ranked.outer[0].id})}
  const sh=bySec("chaussures");if(sh.length){ranked.shoes=rank(sh,mood,M.shoes,base());pieces.push({role:"shoes",id:ranked.shoes[0].id})}
  const bg=bySec("sacs");if(bg.length){ranked.bag=rank(bg,mood,M.bag,base());pieces.push({role:"bag",id:ranked.bag[0].id})}
  const ac=bySec("accessoires");if(ac.length&&M.acc.length&&Math.random()<.5){ranked.acc=rank(ac,mood,M.acc,base());pieces.push({role:"acc",id:ranked.acc[0].id})}
  const jw=pickJewels(mood,base());ranked.bijou=jw.pool;jw.chosen.forEach(j=>pieces.push({role:"bijou",id:j.id}));
  pieces.forEach(p=>S.recent.add(p.id));if(S.recent.size>16)S.recent=new Set([...S.recent].slice(-16));
  const L={id:uid(),mood,pieces,ranked,hair:M.hair[Math.floor(Math.random()*M.hair.length)],date:Date.now()};beauty(L);return L}
function beauty(L){const M=MOODS[L.mood];const cols=L.pieces.map(p=>itemById(p.id)).filter(Boolean).map(i=>i.color);const lo=loud(cols);
  L.makeup=M.makeup.map(([types,gen])=>{let cand=bySec("maquillage",types);let pick=null;
    if(cand.length){if(types.some(t=>/lèvres|Gloss/.test(t))&&lo.length)cand.sort((a,b)=>hueDist(a.color.h,lo[0].h)-hueDist(b.color.h,lo[0].h));else cand=rank(cand,L.mood,types);pick=cand[0]}
    return{gen,id:pick?pick.id:null}});
  const nl=bySec("ongles");L.nails=nl.length?nl.map(n=>({n,s:scoreItem(n,L.mood,["Vernis"])+harmony([...cols,n.color])})).sort((a,b)=>b.s-a.s)[0].n.id:null}
function swapPiece(pi){const L=S.look,p=L.pieces[pi];const list=(L.ranked[p.role]||[]).filter(i=>i.id===p.id||!L.pieces.some(q=>q.id===i.id));
  const same=p.role==="bijou"?list.filter(i=>i.type===itemById(p.id).type):list;const use=same.length>1?same:list;
  if(use.length<2){toast("Pas d'autre pièce de ce type");return}const idx=use.findIndex(i=>i.id===p.id);p.id=use[(idx+1)%use.length].id;beauty(L);render()}
function tryItem(it){const role=roleOf(it);if(!role){itemSheet(it);return}
  if(!S.look)S.look={id:uid(),mood:S.mood,pieces:[],ranked:{},hair:MOODS[S.mood].hair[0],date:Date.now()};const L=S.look;
  if(role==="bijou"){const ex=L.pieces.findIndex(p=>p.role==="bijou"&&itemById(p.id)?.type===it.type);if(ex>=0)L.pieces[ex].id=it.id;else L.pieces.push({role,id:it.id})}
  else{if(role==="dress")L.pieces=L.pieces.filter(p=>p.role!=="top"&&p.role!=="bottom");if(role==="top"||role==="bottom")L.pieces=L.pieces.filter(p=>p.role!=="dress");
    const ex=L.pieces.find(p=>p.role===role);if(ex)ex.id=it.id;else L.pieces.push({role,id:it.id})}
  L.ranked[role]=L.ranked[role]||[];if(!L.ranked[role].includes(it))L.ranked[role].unshift(it);
  beauty(L);S.sel=L.pieces.findIndex(p=>p.id===it.id);if(S.page!=="studio")S.page="studio";closeSheet();render();toast(it.type+" essayé")}

  <datalist id="brand-list">${brandList().map(b=>`<option value="${esc(b)}"></option>`).join("")}</datalist>
  <div class="field"><label for="i-color">Couleur</label><div class="colorrow"><input type="color" id="i-color" value="${it.color?.hex||"#cccccc"}"><span>${esc(colorName(it))}</span></div></div>
  ${it.demo||!it.hasCut?"":`<label class="toggle" style="margin-top:14px"><input type="checkbox" id="i-nocut" ${it.nocut?"":"checked"}> Fond retiré pour l'essayage</label>`}
  <div class="row" style="margin-top:18px" id="del-zone"><button class="btn ghost" data-act="close">Fermer</button><button class="btn ghost small" data-act="askdel">Supprimer</button></div>`)}

/* ================= Glisser-déposer sur la photo ================= */
let drag=null;
document.addEventListener("pointerdown",e=>{const w=e.target.closest(".wear");if(!w)return;e.preventDefault();
  const fig=$("#fig").getBoundingClientRect();const pi=+w.dataset.pi;const p=S.look.pieces[pi];const f=getFit(p);
  drag={w,p,pi,fig,sx:e.clientX,sy:e.clientY,f0:{...f},f};try{w.setPointerCapture(e.pointerId)}catch(_){}
  document.querySelectorAll(".wear.sel").forEach(x=>x.classList.remove("sel"));w.classList.add("sel")});
document.addEventListener("pointermove",e=>{if(!drag)return;const f=drag.f;
  f.x=Math.max(-10,Math.min(110,drag.f0.x+(e.clientX-drag.sx)/drag.fig.width*100));f.y=Math.max(-10,Math.min(110,drag.f0.y+(e.clientY-drag.sy)/drag.fig.height*100));
  drag.w.style.left=f.x+"%";drag.w.style.top=f.y+"%"});
document.addEventListener("pointerup",()=>{if(!drag)return;setFit(drag.p,{...drag.f});S.sel=drag.pi;drag=null;render()});
document.addEventListener("wheel",e=>{const w=e.target.closest(".wear");if(!w)return;e.preventDefault();resize(+w.dataset.pi,e.deltaY<0?2:-2)},{passive:false});
function resize(pi,dw){const p=S.look.pieces[pi];const f=getFit(p);f.w=Math.max(4,Math.min(120,f.w+dw));setFit(p,f);S.sel=pi;render()}

/* ================= Événements ================= */
async function removeIds(ids){for(const id of ids){await sDel("items",id);await deleteItemFiles(id)}S.items=S.items.filter(i=>!ids.has(i.id));
  if(S.look){S.look.pieces=S.look.pieces.filter(p=>!ids.has(p.id));Object.keys(S.look.ranked||{}).forEach(k=>S.look.ranked[k]=S.look.ranked[k].filter(i=>!ids.has(i.id)));beauty(S.look)}S.sel=null}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-go],[data-mood],[data-act],[data-item],[data-try],[data-tab],[data-tf],[data-dsec],[data-dtype],[data-dmood],[data-imood],[data-isec],[data-itype],[data-close],[data-wear],[data-unfav],[data-swap],[data-rm],[data-sel],[data-size],[data-fav],[data-brand],[data-view]");if(!t)return;
  if(t.dataset.close){if(e.target===t)closeSheet();return}
  const D=t.dataset;
  if(D.go){if(D.go==="add"){S.draft=null;addSheet();return}S.page=D.go;closeSheet();render();scrollTo(0,0);if(D.go==="profil")updateStorage();return}
  if(D.mood){S.mood=D.mood;S.look=generate(S.mood);S.sel=null;render();return}
  if(D.fav){const it=itemById(D.fav);it.fav=!it.fav;await sPut("items",it);t.setAttribute("aria-pressed",it.fav);return}
  if("brand" in D){S.brand=D.brand||null;S.q="";S.aiHits=null;S.limit=60;render();return}
  if(D.view){S.board=D.view==="flat";S.sel=null;render();return}
  if(D.tab){S.dressTab=D.tab;S.tf=null;S.brand=null;S.q="";S.aiHits=null;S.limit=60;render();return}
  if(D.tf!==undefined){S.tf=D.tf||null;S.limit=60;render();return}
  if(D.try){tryItem(itemById(D.try));return}
  if(D.item){itemSheet(itemById(D.item));const it=itemById(D.item);loadURL(it.id+(it.hasCut&&!it.nocut?":cut":":img")).then(u=>{const el=$("#sheet-img");if(u&&el)el.src=u});return}
  if(D.swap!==undefined){swapPiece(+D.swap);return}
  if(D.rm!==undefined){S.look.pieces.splice(+D.rm,1);S.sel=null;beauty(S.look);render();return}
  if(D.sel!==undefined){S.sel=S.sel===+D.sel?null:+D.sel;render();return}
  if(D.size){if(S.sel!=null)resize(S.sel,+D.size);return}
  if(D.dsec){S.draft.section=D.dsec;S.draft.type=null;addSheet();return}
  if(D.dtype){S.draft.type=D.dtype;addSheet();return}
  if(D.dmood){const m=S.draft.moods,k=D.dmood;m.includes(k)?m.splice(m.indexOf(k),1):m.push(k);t.setAttribute("aria-pressed",m.includes(k));return}
  if(D.imood){const it=itemById(S.open);it.moods=it.moods||[];const k=D.imood;it.moods.includes(k)?it.moods.splice(it.moods.indexOf(k),1):it.moods.push(k);t.setAttribute("aria-pressed",it.moods.includes(k));await sPut("items",it);return}
  if(D.isec){const it=itemById(S.open);if(it.section!==D.isec){it.section=D.isec;it.type=SECTIONS[D.isec].types[0];await sPut("items",it);itemSheet(it);render()}return}
  if(D.itype){const it=itemById(S.open);it.type=D.itype;await sPut("items",it);itemSheet(it);render();return}
  if(D.wear){const l=S.looks.find(x=>x.id===D.wear);S.look={...JSON.parse(JSON.stringify(l)),ranked:{}};S.look.pieces=S.look.pieces.filter(p=>itemById(p.id));S.look.pieces.forEach(p=>{(S.look.ranked[p.role]=S.look.ranked[p.role]||[]).push(itemById(p.id))});
    beauty(S.look);S.mood=l.mood;S.page="studio";S.sel=null;render();scrollTo(0,0);return}
  if(D.unfav){await sDel("looks",D.unfav);S.looks=S.looks.filter(x=>x.id!==D.unfav);render();return}
  const a=D.act;
  if(a==="gen"){S.look=generate(S.mood);S.sel=null;render()}
  else if(a==="more"){S.limit+=60;render()}
  else if(a==="board"){S.board=!S.board;S.sel=null;render()}
  else if(a==="mirror"){S.mirror=!S.mirror;render()}
  else if(a==="desel"){S.sel=null;render()}
  else if(a==="resetfit"){if(S.sel!=null){delete S.profile.fit[fitKey(S.look.pieces[S.sel])];kvSet("profile",S.profile);render()}}
  else if(a==="resetall"){S.profile.fit={};await kvSet("profile",S.profile);toast("Positions réinitialisées");render()}
  else if(a==="savelook"){const l={id:uid(),mood:S.look.mood,pieces:S.look.pieces.map(p=>({...p})),hair:S.look.hair,date:Date.now()};await sPut("looks",l);S.looks.push(l);toast("Look ajouté à tes favoris")}
  else if(a==="cancel"||a==="close")closeSheet();
  else if(a==="aistart"){AI.start().catch(()=>{})}
  else if(a==="reanalyze"){reanalyze()}
  else if(a==="stopjob"){if(S.job){S.job.stop=true;const j=$(".job");if(j)j.outerHTML=jobBar()}}
  else if(a==="recutbody"){try{toast("L'IA détoure ta photo…");const r=await AI.call("cut",dataURLToBlob(S.profile.body));if(r.cut){S.profile.bodyCut=await blobToDataURL(r.cut);S.profile.cutBody=true;await kvSet("profile",S.profile);render();toast("Photo détourée")}}catch(_){toast("Le détourage a échoué")}}
  else if(a==="validate"){const it=itemById(S.open);delete it.review;await sPut("items",it);closeSheet();render();toast("Pièce validée")}
  else if(a==="savedraft"){const d=S.draft;if(!d.type)return;const note=$("#d-note")?.value||"";
    const brand=($("#d-brand")?.value||"").trim(),price=parsePrice($("#d-price")?.value);
    const it=await saveNewItem(d.a,{section:d.section,type:d.type,color:d.color,moods:d.moods,note,brand,price});try{URL.revokeObjectURL(d.prev)}catch(_){}
    const q=d.queue||[];toast(it.type+" rangé");if(q.length){S.draft={queue:q.slice(1),section:d.section,busy:true};await loadDraft(q[0])}else{closeSheet();S.dressTab=it.section;S.tf=null;if(S.page!=="studio")S.page="dressing";render()}}
  else if(a==="askdel"){$("#del-zone").innerHTML=`<span>Supprimer cette pièce ?</span><button class="btn danger small" data-act="del">Oui, supprimer</button><button class="btn ghost small" data-act="close">Non</button>`}
  else if(a==="del"){const id=S.open;await removeIds(new Set([id]));closeSheet();render();toast("Pièce supprimée")}
  else if(a==="cleardemo"){await removeIds(new Set(S.items.filter(i=>i.demo).map(i=>i.id)));render();toast("Exemples effacés")}
  else if(a==="export")exportAll();
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="cam-in"||t.id==="gal-in"){await startDraft(t.files,S.dressTab&&S.dressTab!=="review"?S.dressTab:"vetements");return}
  if(t.id==="d-color"){S.draft.color=colorInfo(t.value);addSheet();return}
  if(t.id==="i-color"){const it=itemById(S.open);it.color=colorInfo(t.value);await sPut("items",it);itemSheet(it);render();return}
  if(t.id==="i-brand"||t.id==="i-price"){const it=itemById(S.open);if(t.id==="i-brand")it.brand=t.value.trim();else it.price=parsePrice(t.value);await sPut("items",it);render();return}
  if(t.id==="i-nocut"){const it=itemById(S.open);it.nocut=!t.checked;await sPut("items",it);itemSheet(it);render();return}
  if(t.id==="cutbody"){S.profile.cutBody=t.checked;await kvSet("profile",S.profile);render();return}
  if(t.dataset.pphoto){const f=t.files[0];if(!f)return;try{const b=await shrink(f,t.dataset.pphoto==="body"?1400:900);S.profile[t.dataset.pphoto]=await blobToDataURL(b);
      if(t.dataset.pphoto==="body"){S.profile.bodyCut=null;render();toast(AI.ready?"L'IA retire le fond…":"Je retire le fond…");
        let c=null;if(AI.ready){try{c=(await AI.call("cut",b)).cut}catch(_){}}if(!c)c=await floodCut(b,900);S.profile.bodyCut=await blobToDataURL(c)}
      await kvSet("profile",S.profile);render()}catch(_){toast("Impossible de lire cette photo")}return}
  if(t.dataset.prof){S.profile[t.dataset.prof]=t.value;await kvSet("profile",S.profile);if(t.dataset.prof!=="name"&&t.dataset.prof!=="house")render();return}
  if(t.id==="imp"){const f=t.files[0];if(!f)return;importAll(f)}
});
let qT=null;
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.prof==="name"||t.dataset.prof==="house"){S.profile[t.dataset.prof]=t.value;kvSet("profile",S.profile);if(t.dataset.prof==="house")document.querySelectorAll(".wm").forEach(w=>w.textContent=house());return}
  if(t.id&&t.id.startsWith("q-")){S.q=t.value;S.aiHits=null;S.limit=60;const m=t.id.slice(2);const g=$("#grid-"+m);if(g)g.innerHTML=gridHTML(m);
    clearTimeout(qT);if(AI.ready&&S.q.trim().length>=3)qT=setTimeout(()=>semanticSearch(S.q,m),450)}});
async function semanticSearch(q,m){const withEmb=S.items.filter(i=>i.emb);if(!withEmb.length)return;try{const[te]=await AI.call("embedText",[toEnglish(q)]);if(S.q!==q)return;
  const sc=withEmb.map(i=>({i,s:dot(i.emb,te)})).sort((a,b)=>b.s-a.s);const top=sc[0].s;
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);const textHit=i=>words.every(w=>(i.type+" "+colorName(i)+" "+(i.note||"")).toLowerCase().includes(w));
  const ids=[...new Set([...S.items.filter(textHit).map(i=>i.id),...sc.filter(x=>x.s>top-.035).slice(0,40).map(x=>x.i.id)])];
  S.aiHits=ids;const g=$("#grid-"+m);if(g)g.innerHTML=gridHTML(m)}catch(_){}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML)closeSheet()});

/* ================= Sauvegarde ================= */
async function exportAll(){toast("Préparation de la sauvegarde…");const files={};
  for(const it of S.items){if(it.demo)continue;for(const k of["img","cut"]){const b=await fGet(it.id+":"+k);if(b)files[it.id+":"+k]=await blobToDataURL(b)}}
  const items=S.items.filter(i=>!i.demo).map(i=>{const o={...i};delete o._ms;if(o.emb)o.emb=Array.from(o.emb);return o});
  const data=JSON.stringify({v:3,profile:S.profile,items,looks:S.looks,files});
  const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));const l=document.createElement("a");l.href=url;l.download="atelier-boucle-sauvegarde.json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);toast("Sauvegarde créée")}
async function importAll(f){try{toast("Import en cours…");const j=JSON.parse(await f.text());const files=j.files||{};
  for(const raw of j.items||[]){const it={...raw};if(it.emb)it.emb=Float32Array.from(it.emb);
    if(typeof it.img==="string"){files[it.id+":img"]=it.img;if(it.cut)files[it.id+":cut"]=it.cut;delete it.img;delete it.cut;it.hasCut=!!files[it.id+":cut"]}
    const img=files[it.id+":img"]?dataURLToBlob(files[it.id+":img"]):null;if(!img)continue;const cut=files[it.id+":cut"]?dataURLToBlob(files[it.id+":cut"]):null;
    await storeFiles(it.id,{img,cut,thumb:await shrink(cut||img,420,"image/jpeg","#ffffff",.8)});it.hasCut=!!cut;await sPut("items",it)}
  for(const l of j.looks||[])await sPut("looks",l);if(j.profile){S.profile={...S.profile,...j.profile,fit:{...S.profile.fit,...(j.profile.fit||{})}};await kvSet("profile",S.profile)}
  S.items=await sAll("items");S.looks=await sAll("looks");await Promise.all(S.items.map(i=>loadURL(i.id+":thumb")));render();updateStorage();toast("Sauvegarde importée")}catch(_){toast("Ce fichier n'est pas une sauvegarde Atelier")}}

/* ================= Démarrage ================= */
async function migrate(){for(const it of S.items){let ch=false;
  if(it.section==="accessoires"&&it.type==="Bijoux"){it.section="bijoux";it.type="Collier";ch=true}
  if(typeof it.img==="string"){const img=dataURLToBlob(it.img);const cut=typeof it.cut==="string"?dataURLToBlob(it.cut):null;
    await storeFiles(it.id,{img,cut,thumb:await shrink(cut||img,420,"image/jpeg","#ffffff",.8)});it.hasCut=!!cut;delete it.img;delete it.cut;ch=true}
  if(ch)await sPut("items",it)}}
(async()=>{try{await DB.open()}catch(_){useDB=false}
  try{S.profile={curl:"3B",...(await kvGet("profile")||{})};S.profile.fit=S.profile.fit||{};S.items=await sAll("items");
    if(!(await kvGet("seeded3"))){const old=new Set(S.items.filter(i=>i.demo).map(i=>i.id));for(const id of old){await sDel("items",id);await deleteItemFiles(id)}
      await seedDemo();await kvSet("seeded3",true);S.items=await sAll("items")}
    await migrate();S.looks=await sAll("looks")}catch(err){console.error(err);useDB=false;await seedDemo();S.items=await sAll("items")}
  await Promise.all(S.items.map(i=>loadURL(i.id+":thumb")));
  S.look=S.items.length?generate(S.mood):null;render();
  if(!IN_CLAUDE&&await kvGet("aiEnabled").catch(()=>false))AI.start().catch(()=>{});
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!IN_CLAUDE)navigator.serviceWorker.register("sw.js").catch(()=>{})})();
</script>
